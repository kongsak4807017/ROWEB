<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player-visible Content Studio</title>
<style>
:root{--bg:#071019;--panel:#10212d;--line:#294052;--text:#edf7fa;--muted:#8fa8b6;--green:#48d7b0;--amber:#ffbe5c;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,system-ui,sans-serif}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between}main{padding:24px 28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button,input{background:#0b1822;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button.active{border-color:var(--green);color:var(--green)}input{min-width:320px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.card,.row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px}.card strong{display:block;font-size:24px;margin-top:6px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:140px minmax(220px,1fr) 120px 2fr;gap:12px;align-items:start}.muted{color:var(--muted)}.matched{color:var(--green)}.ambiguous{color:var(--amber)}.missing{color:var(--red)}code{word-break:break-all}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}input{min-width:0;width:100%}}</style>
</head>
<body>
<header><div><div style="color:var(--green);font-weight:800">PLAYER EXPERIENCE</div><h1>Player-visible Content Studio</h1></div><a href="index.html" style="color:var(--green)">กลับ Workbench</a></header>
<main>
<div class="toolbar"><button class="active" data-tab="items">Items</button><button data-tab="uiImages">UI Images</button><button data-tab="playerTexts">Player Texts</button><input id="search" placeholder="ค้นหา ID, ชื่อ, path, description, status"></div>
<div class="stats"><div class="card"><span>Targeted files indexed</span><strong id="indexed">0</strong></div><div class="card"><span>UI images</span><strong id="uiCount">0</strong></div><div class="card"><span>Items</span><strong id="itemCount">0</strong></div><div class="card"><span>Text sources</span><strong id="textCount">0</strong></div></div>
<div id="status" class="muted">กำลังโหลด player-visible-content-catalog.json…</div><div id="list" class="list"></div>
</main>
<script>
let data=null,tab='items';const list=document.getElementById('list'),status=document.getElementById('status'),search=document.getElementById('search');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!data)return;const q=search.value.toLowerCase();const rows=(data[tab]||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));status.textContent=`${tab}: ${rows.length} records`;list.innerHTML=rows.map(x=>{if(tab==='items')return `<div class="row"><b>#${esc(x.itemId)}</b><div><b>${esc(x.identifiedName)}</b><div class="muted">${esc((x.identifiedDescription||[]).join(' · '))}</div></div><span class="${esc(x.iconStatus)}">${esc(x.iconStatus)}</span><code>${esc((x.iconMatches||[]).join('\n')||x.identifiedResourceName)}</code></div>`;if(tab==='uiImages')return `<div class="row"><b>${esc(x.status)}</b><code>${esc(x.expression)}</code><span class="${esc(x.status)}">${esc(x.status)}</span><code>${esc(x.source)}\n${esc((x.matches||[]).join('\n'))}</code></div>`;return `<div class="row"><b>${esc(x.encoding)}</b><code>${esc(x.path)}</code><span>${esc(x.lineCount)} lines</span><code>${esc((x.warnings||[]).join(', '))}</code></div>`}).join('')||'<div class="card muted">ไม่พบรายการ</div>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});search.oninput=render;
fetch('player-visible-content-catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{data=d;indexed.textContent=d.scan?.targetedFilesIndexed||0;uiCount.textContent=d.stats?.uiImages||0;itemCount.textContent=d.stats?.items||0;textCount.textContent=d.stats?.playerTexts||0;render()}).catch(e=>status.textContent='ยังไม่มี Catalog หรือโหลดไม่สำเร็จ: '+e.message+' — รัน tools/player-ui/build_player_visible_catalog.ps1 ก่อน');
</script>
</body></html>
