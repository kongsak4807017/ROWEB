<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player-visible Content Studio</title>
<style>
:root{--bg:#071019;--panel:#10212d;--line:#294052;--text:#edf7fa;--muted:#8fa8b6;--green:#48d7b0;--amber:#ffbe5c;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,system-ui,sans-serif}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between}main{padding:24px 28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button,input{background:#0b1822;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button{cursor:pointer}button.active{border-color:var(--green);color:var(--green)}input{min-width:360px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.card,.row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px}.card strong{display:block;font-size:24px;margin-top:6px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:88px minmax(260px,1fr) 130px minmax(320px,2fr);gap:14px;align-items:center}.row.text-row{grid-template-columns:minmax(310px,1.2fr) 130px minmax(360px,1.8fr) 180px}.preview{width:72px;height:72px;border:1px solid var(--line);border-radius:8px;background:#07131c;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.preview.empty{color:var(--muted);font-size:11px;text-align:center;padding:6px}.muted{color:var(--muted)}.matched{color:var(--green)}.ambiguous{color:var(--amber)}.missing{color:var(--red)}code{word-break:break-all;white-space:pre-wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:6px 9px;font-size:12px}.text-preview{max-height:120px;overflow:auto;white-space:pre-wrap;color:#d9e7ed;line-height:1.45}.diag{margin:0 0 14px;padding:12px;border:1px solid #6b542f;background:#231e14;border-radius:8px;color:var(--amber)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.row,.row.text-row{grid-template-columns:1fr}.preview{width:96px;height:96px}input{min-width:0;width:100%}}</style>
</head>
<body>
<header><div><div style="color:var(--green);font-weight:800">PLAYER EXPERIENCE</div><h1>Player-visible Content Studio</h1></div><a href="index.html" style="color:var(--green)">กลับ Workbench</a></header>
<main>
<div class="toolbar"><button class="active" data-tab="items">Items</button><button data-tab="uiImages">UI Images</button><button data-tab="playerTexts">Player Texts</button><input id="search" placeholder="ค้นหา ID, ชื่อ, path, description, status"></div>
<div class="stats"><div class="card"><span>Targeted files indexed</span><strong id="indexed">0</strong></div><div class="card"><span>UI images</span><strong id="uiCount">0</strong></div><div class="card"><span>Items</span><strong id="itemCount">0</strong></div><div class="card"><span>Text sources</span><strong id="textCount">0</strong></div></div>
<div id="diagnostics"></div><div id="status" class="muted">กำลังโหลด player-visible-content-catalog.json…</div><div id="list" class="list"></div>
</main>
<script>
let data=null,tab='items';const list=document.getElementById('list'),status=document.getElementById('status'),search=document.getElementById('search');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const assetUrl=p=>p?`/asset?path=${encodeURIComponent(p)}`:'';
const preview=(paths,label='No preview')=>paths?.length?`<div class="preview"><img loading="lazy" src="${assetUrl(paths[0])}" alt="preview" onerror="this.parentElement.classList.add('empty');this.parentElement.textContent='Preview unavailable'"></div>`:`<div class="preview empty">${esc(label)}</div>`;
const actions=path=>path?`<div class="actions"><button class="mini" data-action="reveal" data-path="${esc(path)}">หาไฟล์</button><button class="mini" data-action="open" data-path="${esc(path)}">เปิดไฟล์</button><button class="mini" data-action="copy" data-path="${esc(path)}">คัดลอก path</button></div>`:'';
function render(){if(!data)return;const q=search.value.toLowerCase();const rows=(data[tab]||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));status.textContent=`${tab}: ${rows.length} records`;list.innerHTML=rows.map(x=>{if(tab==='items'){const p=(x.iconMatches||[])[0]||x.sourceFile;return `<div class="row">${preview(x.iconMatches,'No icon')}<div><b>#${esc(x.itemId)} · ${esc(x.identifiedName)}</b><div class="muted">${esc((x.identifiedDescription||[]).join(' · '))}</div><small>${esc(x.identifiedResourceName)} · ${esc(x.sourceFormat||'')}</small></div><span class="${esc(x.iconStatus)}">${esc(x.iconStatus)}</span><div><code>${esc((x.iconMatches||[]).join('\n')||x.sourceFile)}</code>${actions(p)}</div></div>`}if(tab==='uiImages'){const p=(x.matches||[])[0];return `<div class="row">${preview(x.matches,x.status)}<div><code>${esc(x.expression)}</code><div class="muted">${esc(x.source)}</div></div><span class="${esc(x.status)}">${esc(x.status)}${(x.matches||[]).length>1?` · ${(x.matches||[]).length} files`:''}</span><div><code>${esc((x.matches||[]).join('\n')||'ไม่พบไฟล์')}</code>${actions(p)}</div></div>`}return `<div class="row text-row"><div><b>${esc(x.path.split(/[\\/]/).pop())}</b><code>${esc(x.path)}</code></div><div><b>${esc(x.encoding)}</b><div class="muted">${esc(x.lineCount)} lines</div></div><div class="text-preview">${esc(x.preview||'ไม่มีตัวอย่างข้อความ')}</div><div>${actions(x.path)}</div></div>`}).join('')||'<div class="card muted">ไม่พบรายการ</div>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});search.oninput=render;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const path=b.dataset.path;if(b.dataset.action==='copy'){await navigator.clipboard.writeText(path);b.textContent='คัดลอกแล้ว';setTimeout(()=>b.textContent='คัดลอก path',1200);return}try{const r=await fetch(`/api/${b.dataset.action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});if(!r.ok)throw new Error(await r.text())}catch(err){alert('คำสั่งนี้ต้องเปิดด้วย tools/player-ui/serve_player_visible_studio.ps1\n'+err)}});
fetch('player-visible-content-catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{data=d;indexed.textContent=d.scan?.targetedFilesIndexed||0;uiCount.textContent=d.stats?.uiImages||0;itemCount.textContent=d.stats?.items||0;textCount.textContent=d.stats?.playerTexts||0;const ds=d.scan?.diagnostics||[];diagnostics.innerHTML=ds.length?`<div class="diag">${ds.map(esc).join('<br>')}</div>`:'';render()}).catch(e=>status.textContent='ยังไม่มี Catalog หรือโหลดไม่สำเร็จ: '+e.message+' — รัน tools/player-ui/build_player_visible_catalog.ps1 ก่อน');
</script>
</body></html>
