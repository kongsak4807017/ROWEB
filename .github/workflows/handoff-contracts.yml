name: Handoff Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "research/**"
      - "protocol/**"
      - "docs/adr/**"
      - "docs/handoff/**"
      - "docs/superpowers/specs/2026-08-01-roweb-long-term-handoff-design.md"
      - "docs/superpowers/plans/2026-08-01-roweb-handoff-foundation.md"
      - "tests/contracts/**"
      - "tests/handoff/**"
      - "tools/validation/**"
      - "compatibility.lock.json"
      - "requirements-handoff.txt"
      - ".github/workflows/handoff-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "research/**"
      - "protocol/**"
      - "docs/adr/**"
      - "docs/handoff/**"
      - "tests/contracts/**"
      - "tests/handoff/**"
      - "tools/validation/**"
      - "compatibility.lock.json"
      - "requirements-handoff.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-handoff.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-handoff.txt

      - name: Validate handoff package
        run: python -m tools.validation.validate_handoff

      - name: Run contract and handoff tests
        run: python -m pytest tests/contracts tests/handoff -v
